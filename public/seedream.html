<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seedream 4.5 - AI Image Generator</title>
    <link rel="stylesheet" href="/static/css/seedream.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    <span>Seedream 4.5</span>
                </div>
                <nav class="nav">
                    <a href="/" class="nav-link">Home</a>
                    <button class="btn-settings" id="settingsBtn" title="Settings">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </button>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Mode Selector -->
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="text2img">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14,2 14,8 20,8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                    <span>텍스트 → 이미지</span>
                </button>
                <button class="mode-btn" data-mode="img2img">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21,15 16,10 5,21"/>
                    </svg>
                    <span>이미지 편집</span>
                </button>
                <button class="mode-btn" data-mode="parallel">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="2" width="8" height="8" rx="1"/>
                        <rect x="14" y="2" width="8" height="8" rx="1"/>
                        <rect x="2" y="14" width="8" height="8" rx="1"/>
                        <rect x="14" y="14" width="8" height="8" rx="1"/>
                    </svg>
                    <span>병렬 처리</span>
                </button>
            </div>

            <!-- Workspace -->
            <div class="workspace">
                <!-- Left Panel: Input -->
                <div class="panel panel-input">
                    <div class="panel-header">
                        <h2>입력</h2>
                    </div>

                    <!-- Prompt Input -->
                    <div class="input-section">
                        <label class="input-label">프롬프트</label>
                        <textarea
                            id="promptInput"
                            class="prompt-textarea"
                            placeholder="생성하고 싶은 이미지를 설명하세요...&#10;&#10;예: A serene Japanese garden with cherry blossoms, koi pond, wooden bridge, morning mist, photorealistic, 8k quality"
                            rows="6"
                        ></textarea>
                        <div class="prompt-actions">
                            <button class="btn-icon" id="clearPrompt" title="Clear">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"/>
                                    <line x1="6" y1="6" x2="18" y2="18"/>
                                </svg>
                            </button>
                            <span class="char-count"><span id="charCount">0</span> / 2000</span>
                        </div>
                    </div>

                    <!-- Reference Images (for img2img and parallel modes) -->
                    <div class="input-section reference-section" id="referenceSection" style="display: none;">
                        <label class="input-label">
                            참조 이미지
                            <span class="label-hint" id="slotHint">최대 5개 슬롯</span>
                        </label>

                        <!-- Slots Container -->
                        <div class="slots-container" id="slotsContainer">
                            <!-- Single upload for img2img mode -->
                            <div class="upload-zone" id="singleUpload">
                                <div class="upload-content">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                        <polyline points="17,8 12,3 7,8"/>
                                        <line x1="12" y1="3" x2="12" y2="15"/>
                                    </svg>
                                    <p>이미지를 드래그하거나 클릭하여 업로드</p>
                                    <span class="upload-hint">PNG, JPG, WEBP (최대 10MB)</span>
                                </div>
                                <input type="file" id="singleFileInput" accept="image/*" hidden>
                            </div>

                            <!-- Parallel slots -->
                            <div class="parallel-slots" id="parallelSlots" style="display: none;">
                                <!-- Slots will be generated by JS -->
                            </div>
                        </div>

                        <!-- Preview Area -->
                        <div class="preview-area" id="previewArea" style="display: none;">
                            <div class="preview-grid" id="previewGrid">
                                <!-- Preview images will be added here -->
                            </div>
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="input-section options-section">
                        <label class="input-label">옵션</label>
                        <div class="options-grid">
                            <div class="option-item">
                                <label>이미지 크기</label>
                                <select id="imageSize" class="select-input">
                                    <option value="1K">1K (1024×1024)</option>
                                    <option value="2K" selected>2K (2048×2048)</option>
                                    <option value="4K">4K (4096×4096)</option>
                                </select>
                            </div>
                            <div class="option-item">
                                <label>생성 개수</label>
                                <select id="imageCount" class="select-input">
                                    <option value="1" selected>1장</option>
                                    <option value="2">2장</option>
                                    <option value="4">4장</option>
                                </select>
                            </div>
                            <div class="option-item">
                                <label>시드 (선택)</label>
                                <input type="number" id="seedInput" class="text-input" placeholder="랜덤">
                            </div>
                            <div class="option-item">
                                <label>
                                    <input type="checkbox" id="watermarkCheck">
                                    워터마크 추가
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Generate Button -->
                    <button class="btn-generate" id="generateBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/>
                        </svg>
                        <span>이미지 생성</span>
                    </button>
                </div>

                <!-- Right Panel: Output -->
                <div class="panel panel-output">
                    <div class="panel-header">
                        <h2>결과</h2>
                        <div class="panel-actions">
                            <button class="btn-icon" id="downloadAllBtn" title="Download All" disabled>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="7,10 12,15 17,10"/>
                                    <line x1="12" y1="15" x2="12" y2="3"/>
                                </svg>
                            </button>
                            <button class="btn-icon" id="clearResultsBtn" title="Clear Results" disabled>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3,6 5,6 21,6"/>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Progress Section -->
                    <div class="progress-section" id="progressSection" style="display: none;">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-info">
                            <span id="progressText">준비 중...</span>
                            <span id="progressPercent">0%</span>
                        </div>
                        <!-- Parallel Progress -->
                        <div class="parallel-progress" id="parallelProgress" style="display: none;">
                            <!-- Slot progress items will be added here -->
                        </div>
                    </div>

                    <!-- Results Grid -->
                    <div class="results-area" id="resultsArea">
                        <div class="empty-state" id="emptyState">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21,15 16,10 5,21"/>
                            </svg>
                            <p>생성된 이미지가 여기에 표시됩니다</p>
                        </div>
                        <div class="results-grid" id="resultsGrid">
                            <!-- Generated images will be added here -->
                        </div>
                    </div>

                    <!-- History -->
                    <div class="history-section">
                        <button class="history-toggle" id="historyToggle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <polyline points="12,6 12,12 16,14"/>
                            </svg>
                            <span>히스토리</span>
                            <span class="history-count" id="historyCount">0</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Settings Modal -->
        <div class="modal" id="settingsModal">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3>설정</h3>
                    <button class="btn-close" id="closeSettings">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="setting-item">
                        <label>API Key</label>
                        <input type="password" id="apiKeyInput" class="text-input" placeholder="API Key를 입력하세요">
                        <button class="btn-toggle-visibility" id="toggleApiKey">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="setting-item">
                        <label>API Provider</label>
                        <select id="apiProvider" class="select-input">
                            <option value="aimlapi">AI/ML API</option>
                            <option value="byteplus">BytePlus</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>동시 처리 수</label>
                        <select id="maxConcurrent" class="select-input">
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="5" selected>5</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="saveHistory" checked>
                            히스토리 저장 (로컬)
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" id="cancelSettings">취소</button>
                    <button class="btn-primary" id="saveSettings">저장</button>
                </div>
            </div>
        </div>

        <!-- Image Preview Modal -->
        <div class="modal" id="imageModal">
            <div class="modal-backdrop"></div>
            <div class="modal-content modal-image">
                <button class="btn-close" id="closeImageModal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                <img id="modalImage" src="" alt="Preview">
                <div class="modal-image-actions">
                    <button class="btn-icon" id="downloadImage" title="Download">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7,10 12,15 17,10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                    </button>
                    <button class="btn-icon" id="copyImage" title="Copy to Clipboard">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                    </button>
                    <button class="btn-icon" id="useAsReference" title="Use as Reference">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15,3 21,3 21,9"/>
                            <polyline points="9,21 3,21 3,15"/>
                            <line x1="21" y1="3" x2="14" y2="10"/>
                            <line x1="3" y1="21" x2="10" y2="14"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- History Modal -->
        <div class="modal" id="historyModal">
            <div class="modal-backdrop"></div>
            <div class="modal-content modal-history">
                <div class="modal-header">
                    <h3>히스토리</h3>
                    <div class="modal-header-actions">
                        <button class="btn-text" id="clearHistory">모두 삭제</button>
                        <button class="btn-close" id="closeHistory">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="history-list" id="historyList">
                        <!-- History items will be added here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div class="toast-container" id="toastContainer"></div>
    </div>

    <script src="/static/js/seedream.js"></script>
</body>
</html>
